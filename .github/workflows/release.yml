name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install WiX Toolset for MSI Maker
        shell: powershell
        run: |
          choco install wixtoolset --version=3.14.0 -y
          "$env:ProgramFiles(x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Decode Windows Code-Signing Certificate
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        shell: powershell
        run: |
          $certBytes = [System.Convert]::FromBase64String("$env:WINDOWS_CERT_BASE64")
          [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\cert.pfx", $certBytes)

      - name: Build and Package Installers (Electron Forge)
        shell: powershell
        run: npm run make
        env:
          CI: true

      - name: Sign Windows MSI Installer
        if: ${{ secrets.WINDOWS_CERT_PASSWORD != '' }}
        shell: powershell
        run: |
          $msiPaths = Get-ChildItem -Path "out/make" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue
          if ($msiPaths) {
            foreach ($msi in $msiPaths) {
              Write-Host "Signing installer: $($msi.FullName)"
              & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe" sign /f "cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 "$($msi.FullName)"
            }
          } else {
            Write-Warning "MSI artifact not found for signing."
          }

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/make/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
